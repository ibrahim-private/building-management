<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <meta name="description" content="إدارة اشتراكات العمارة والمصروفات والخزينة" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>إدارة العمارة</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // The source of truth is the Settings table; localStorage is only a mirror.
      try {
        var t = localStorage.getItem('bm-theme');
        var p = localStorage.getItem('bm-primary');
        if (t === 'dark') document.documentElement.classList.add('dark');
        if (p) document.documentElement.setAttribute('data-primary', p);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
